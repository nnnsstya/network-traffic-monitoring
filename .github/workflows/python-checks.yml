
name: Проверка домашнего задания

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      ALLOW_EXTERNAL_CALLS: "0"
    steps:
      - name: Получить файлы из репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Установить зависимости
        run: python -m pip install -r requirements.txt

      - name: Проверить работу кода
        run: python -m unittest discover -s tests -v

      - name: Запустить все три задания
        run: python main.py

      - name: Сохранить отчёты
        uses: actions/upload-artifact@v4
        with:
          name: otchet-monitoring
          path: results/
          if-no-files-found: error
